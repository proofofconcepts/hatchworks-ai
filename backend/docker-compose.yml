services:
  postgres:
    image: postgres:16-alpine
    container_name: checkout_postgres
    environment:
      POSTGRES_USER: checkout_user
      POSTGRES_PASSWORD: checkout_pass
      POSTGRES_DB: checkout_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkout_user -d checkout_db"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
