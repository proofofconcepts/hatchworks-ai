services:
  - type: web
    name: checkout-service
    env: node
    region: oregon
    buildCommand: npm ci && npx prisma generate && npm run build && npx prisma migrate deploy
    startCommand: node dist/main.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_PORT
        value: 3000
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: 24h
      - key: DATABASE_URL
        fromDatabase:
          name: checkout-postgres
          property: connectionString

databases:
  - name: checkout-postgres
    databaseName: checkout_db
    user: checkout_user
    region: oregon
